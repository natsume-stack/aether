[package]
name = "box-local-engine-server-manager"
version = "2026.1.4"
edition = "2021"
license = "MIT"

[dependencies]
box-manager-core = { path = "../manager-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
urlencoding = "2"
postgres = "0.19.14"
redis = "1.7.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
