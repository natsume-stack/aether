[package]
name = "box-manager-core"
version = "2026.1.4"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
urlencoding = "2"
flate2 = "=1.1.9"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
